name: aws-infra-opentofu

on:
  workflow_dispatch:
    inputs:
      environment_dir:
        description: "Path to OpenTofu environment directory (e.g. opentofu/aws/template)"
        required: true
        type: string
      module:
        description: "Module to provision (select 'all' to run all modules)"
        required: true
        type: choice
        default: all
        options:
          - all
          - network
          - iam
          - eks
          - storage
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    env:
      TG_TF_PATH: tofu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.1"

      - name: Setup Terragrunt
        run: |
          wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.96.0/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set working directory
        run: |
          if [ "${{ inputs.module }}" == "all" ]; then
            echo "WORK_DIR=${{ inputs.environment_dir }}" >> $GITHUB_ENV
          else
            echo "WORK_DIR=${{ inputs.environment_dir }}/${{ inputs.module }}" >> $GITHUB_ENV
          fi

      - name: Create Backend S3 Bucket
        working-directory: ${{ inputs.environment_dir }}
        run: |
          chmod +x create_tf_backend.sh
          ./create_tf_backend.sh
          ls -la
          source tf.sh

      - name: Terragrunt Init
        if: inputs.action == 'init'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source ${{ github.workspace }}/${{ inputs.environment_dir }}/tf.sh
          if [ "${{ inputs.module }}" == "all" ]; then
            terragrunt run --all init
          else
            terragrunt init
          fi

      - name: Terragrunt Plan
        if: inputs.action == 'plan'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source ${{ github.workspace }}/${{ inputs.environment_dir }}/tf.sh
          if [ "${{ inputs.module }}" == "all" ]; then
            terragrunt run --all plan
          else
            terragrunt plan
          fi

      - name: Terragrunt Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source ${{ github.workspace }}/${{ inputs.environment_dir }}/tf.sh
          export TF_INPUT=false
          if [ "${{ inputs.module }}" == "all" ]; then
            terragrunt run --all apply -- -auto-approve
          else
            terragrunt apply -auto-approve
          fi

      # Please be cautious while running the destroy command as it will delete all the resources created by the apply command
      - name: Terragrunt Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source ${{ github.workspace }}/${{ inputs.environment_dir }}/tf.sh
          export TF_INPUT=false
          if [ "${{ inputs.module }}" == "all" ]; then
            terragrunt run --all destroy -- -auto-approve
          else
            terragrunt destroy -auto-approve
          fi