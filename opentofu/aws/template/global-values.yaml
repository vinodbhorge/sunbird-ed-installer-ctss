default_passwords:
  grafana_admin_password: &grafana-admin-password "prom-operator"
  superset_admin_password: &superset-admin-password "admin"
  keycloak_password: &keycloak-password "admin"
  postgresql_password: &postgresql-password "postgres"

superset:
  init:
    adminUser:
      username: admin
      password: *superset-admin-password
  credentials:
    adminUser: admin
    adminPassword: *superset-admin-password
  supersetNode:
    connections:
      db_pass: *postgresql-password

kube-prometheus-stack:
  grafana:
    adminUser: admin
    adminPassword: *grafana-admin-password

keycloak:
  keycloak_user: admin
  keycloak_password: *keycloak-password

keycloak-kids-keys:
  KEYCLOAK_ADMIN_PASSWORD: *keycloak-password

postgresql:
  postgresqlUsername: postgres
  postgresqlPassword: *postgresql-password

kong:
  kong_pg_password: *postgresql-password

global:
  building_block: "test" # Building block name
  env: "dev" # Short environment name
  environment: "dev" # Environment name (1-9 lowercase alphanumeric characters)
  release_version: "release-7.0.0"
  
  # AWS-specific configuration
  cloud_storage_provider: "aws"
  cloud_service_provider: "s3"
  sunbird_cloud_storage_provider: "aws"
  checkpoint_store_type: "s3"
  cloud_storage_region: "ap-south-1" # e.g., us-east-1

  # Network configuration (optional - set create_network: false if using existing VPC)
  create_network: true
  # vpc_id: "" # If create_network: false, provide existing VPC ID
  # private_subnet_ids: [] # If create_network: false
  # public_subnet_ids: []  # If create_network: false
  # vpc_cidr: "10.0.0.0/16"           # CIDR block for the new VPC
  # ingress_cidr_blocks: ["0.0.0.0/0"] # Allowed CIDRs for HTTP/HTTPS inbound security group

  # Subnet definitions — add/remove entries to control what gets provisioned.
  # Each key becomes the subnet logical name (used in tags and outputs).
  # cidr_netnum is the offset for cidrsubnet(vpc_cidr, 8, N):
  #   101 → 10.0.101.0/24 | 102 → 10.0.102.0/24 | 201 → 10.0.201.0/24, etc.
  subnet_config:
    public-a:
      type: public
      availability_zone: "a"
      cidr_netnum: 101
    public-b:
      type: public
      availability_zone: "b"
      cidr_netnum: 102
    # Add private subnets below to enable private networking.
    # A NAT Gateway is automatically created when private subnets exist (see nat_gateway_enabled).
    # private-a:
    #   type: private
    #   availability_zone: "a"
    #   cidr_netnum: 201
    # private-b:
    #   type: private
    #   availability_zone: "b"
    #   cidr_netnum: 202

  # NAT Gateway — set to false to keep private subnets fully isolated (saves cost in non-prod).
  # Has no effect when no private subnets are defined.
  # nat_gateway_enabled: true

  # EKS configuration
  eks_cluster_version: "1.35"
  eks_node_instance_type: "m6a.2xlarge"
  eks_node_disk_size_gb: 70
  eks_node_count_min: 4
  eks_node_count_max: 5
  # eks_endpoint_public_access: true  # Expose EKS API server publicly
  # eks_endpoint_private_access: false # Expose EKS API server within VPC

  # S3 bucket definitions — add as many buckets as needed.
  # Key becomes the suffix: <building_block>-<env>-<account_id>-<key>
  # type: "public"  → publicly readable, optional CORS
  # type: "private" → fully blocked public access, optional versioning
  buckets:
    public:
      type: public
      cors_enabled: true
    private:
      type: private
      versioning_enabled: true
    # dial:
    #   type: public
    #   cors_enabled: true
    # velero:
    #   type: private
    #   versioning_enabled: true

  # S3 CORS (optional override)
  cors_max_age_seconds: 3000        # Max-age for CORS preflight cache on cors-enabled buckets

  # IAM service account subjects (optional override — add/remove namespaces here)
  # service_account_subjects:
  #   - "system:serviceaccount:sunbird:sunbird-sa"
  #   - "system:serviceaccount:dataset-api:dataset-api-sa"
  #   - "system:serviceaccount:flink:flink-sa"
  #   - "system:serviceaccount:druid-raw:druid-raw-sa"
  #   - "system:serviceaccount:secor:secor-sa"
  #   - "system:serviceaccount:postgresql:postgresql-backup-sa"
  #   - "system:serviceaccount:s3-exporter:s3-exporter-sa"

  # CloudWatch monitoring (replaces Prometheus/Grafana stack)
  enable_cloudwatch_observability: false
  cloudwatch_enabled_log_types:
    - api
    - audit
    - authenticator
    - controllerManager
    - scheduler
  # Database (optional - set create_database: false if using external DB)
  create_database: false
  external_db_host: ""
  external_db_port: "5432"
  external_db_name: "sunbird"
  
  # DNS (optional)
  manage_dns: false
  # route53_zone_id: "Z1234567890ABC"

  # Domain configuration
  domain: "REPLACE_ME" # e.g., sunbird.example.com
  
  # Application secrets (required)
  sunbird_google_captcha_site_key: ""
  google_captcha_private_key: ""
  sunbird_google_oauth_clientId: ""
  sunbird_google_oauth_clientSecret: ""
  mail_server_from_email: ""
  mail_server_password: ""
  mail_server_host: "smtp.sendgrid.net"
  mail_server_port: "587"
  mail_server_username: "apikey"
  sunbird_msg_91_auth: ""
  sunbird_msg_sender: ""
  youtube_apikey: ""
  
  # PostgreSQL configuration
  postgresql:
    postgresqlUsername: postgres
    postgresqlPassword: *postgresql-password
  
  # Merge domain (optional)
  merge_domain_status: "false"
  merge_domain: ""
  
  # SSL certificates (required)
  # Add your domain's SSL private key and certificate
  # Example:
  # proxy_private_key: |
  #   -----BEGIN PRIVATE KEY-----
  #   MII...
  #   -----END PRIVATE KEY-----
  # proxy_certificate: |
  #   -----BEGIN CERTIFICATE-----
  #   MII...
  #   -----END CERTIFICATE-----
  proxy_private_key: |
    REPLACE_ME
  proxy_certificate: |
    REPLACE_ME
